<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Word Train</title>
<style>
:root{
  --ink:#2b2140;
  --font:"Andika","Comic Sans MS","Chalkboard SE","Comic Neue",ui-rounded,"Arial Rounded MT Bold",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe9ff;font-family:var(--font);color:var(--ink)}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:flex}

/* ---------- start ---------- */
#start{flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;padding:16px;
  background:linear-gradient(#8fd8ff 0%,#d8f3ff 70%,#a6e39a 70%,#7ccf5a 100%)}
#title{background:none;border:0;padding:0;font-size:clamp(46px,9vw,100px);font-weight:800;color:#fff;line-height:1;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink)}
#title span:nth-child(1){color:#ff6b5b}#title span:nth-child(2){color:#ffd23f}#title span:nth-child(3){color:#5ad17a}
#title span:nth-child(4){color:#4aa3ff}
#startScene{width:min(92vw,720px);height:min(28vh,230px);border-radius:28px;border:5px solid var(--ink);box-shadow:0 8px 0 rgba(43,33,64,.25);display:block}
#levels{display:flex;gap:min(3vw,28px);flex-wrap:wrap;justify-content:center}
.lvl{min-width:min(27vw,220px);min-height:124px;border-radius:32px;border:5px solid var(--ink);box-shadow:0 8px 0 var(--ink);
  font-size:clamp(26px,4.2vw,42px);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 18px;transition:transform .1s}
.lvl:active,.big:active,.word:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.easy{background:#5ad17a}.medium{background:#ffd23f}.hard{background:#ff6b5b}
.stars{font-size:1.3em;line-height:1;color:#ffe14d;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;letter-spacing:.05em}

/* ---------- game ---------- */
#game{flex-direction:column;background:#fdf6e3}
#sceneWrap{position:relative;flex:0 0 auto}
#scene{display:block;width:100%;height:min(38vh,62vw);border-bottom:5px solid var(--ink)}
#home{position:absolute;top:10px;left:10px;width:54px;height:54px;border-radius:50%;border:4px solid var(--ink);background:#fff;font-size:26px;
  font-family:var(--emoji);opacity:.85;padding:0}
#qarea{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow:hidden;gap:2.2vh;padding:10px 16px;transition:opacity .35s,transform .35s}
#qarea.off{opacity:0;transform:translateY(24px);pointer-events:none}
#pic{font-family:var(--emoji);font-size:clamp(72px,min(16vh,26vw),150px);line-height:1.15;background:#fff;border:5px solid var(--ink);border-radius:36px;padding:0 30px;
  box-shadow:0 8px 0 rgba(43,33,64,.2)}
#pic.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
#pic.wiggle{animation:wiggle .5s}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#words{display:flex;gap:clamp(10px,2.5vw,28px);flex-wrap:wrap;justify-content:center}
.word{font-weight:700;font-size:clamp(36px,6.2vw,66px);line-height:1.1;min-height:96px;min-width:clamp(118px,21vw,220px);padding:6px 26px;border-radius:30px;
  border:5px solid var(--ink);background:#fff;box-shadow:0 8px 0 var(--ink);transition:transform .25s}
.word.yay{background:#5ad17a!important;animation:yay .7s cubic-bezier(.3,1.6,.5,1);box-shadow:0 8px 0 var(--ink),0 0 0 10px #fff59d,0 0 40px 18px #ffe14d}
@keyframes yay{0%{transform:scale(1)}35%{transform:scale(1.25) translateY(-14px)}100%{transform:scale(1.08)}}
.word.pickme{animation:pickme 1.2s ease-in-out infinite}
@keyframes pickme{0%,100%{transform:scale(1)}50%{transform:scale(1.12);box-shadow:0 8px 0 var(--ink),0 0 0 12px rgba(255,225,77,.7)}}
#foot{flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px 14px;pointer-events:none}
#foot>*{pointer-events:auto}
#whistle{width:clamp(96px,14vh,130px);height:clamp(96px,14vh,130px);border-radius:50%;border:6px solid var(--ink);padding:10px;
  background:radial-gradient(circle at 35% 30%,#ff9a8a,#e9483f 70%);box-shadow:0 8px 0 var(--ink)}
#whistle svg{width:100%;height:100%;display:block}
#whistle:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
#whistle.toot svg{animation:toot .4s}
@keyframes toot{40%{transform:scale(1.15,.9)}}
#whistle.hint{animation:hint 1.1s ease-in-out infinite}
@keyframes hint{0%,100%{transform:scale(1);box-shadow:0 8px 0 var(--ink),0 0 0 0 rgba(255,225,77,.95)}
  50%{transform:scale(1.13);box-shadow:0 8px 0 var(--ink),0 0 0 26px rgba(255,225,77,0)}}
#map{width:min(340px,50vw);height:74px;position:relative;background:#fff;border:4px solid var(--ink);border-radius:22px;margin-bottom:4px}
.mtrack,.mfill{position:absolute;left:7%;top:46px;height:8px;border-radius:4px}
.mtrack{right:7%;background:#d9d4e8}
.mfill{width:0;background:#5ad17a}
.node{position:absolute;top:50px;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:4px solid var(--ink);background:#fff}
.node.depot{width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--ink)}
.node.done{background:#5ad17a}
.node.cur{animation:cur 1.4s ease-in-out infinite;background:#ffe14d}
@keyframes cur{50%{box-shadow:0 0 0 7px rgba(255,225,77,.6)}}
#mtrain{position:absolute;top:6px;width:46px;height:30px;left:7%;transform:translateX(-85%)}
#mtrain svg{width:100%;height:100%;display:block}
@media (max-height:520px){
  #foot{position:fixed;left:0;right:0;bottom:0}
  #qarea{padding-bottom:12px}
  #pic{font-size:clamp(60px,14vh,110px)}
  .word{min-height:80px}
}

/* ---------- bugs ---------- */
#bugs{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.bugwrap{position:absolute;left:0;top:0;width:150px;height:150px;will-change:transform}
.bugwrap svg{width:100%;height:100%;display:block;overflow:visible}
.bugwrap svg.munch{animation:munch .35s}
@keyframes munch{40%{transform:scale(1.22)}}
.legA{animation:leg .16s ease-in-out infinite alternate;transform-origin:0 0}
.legB{animation:leg .16s ease-in-out infinite alternate-reverse;transform-origin:0 0}
@keyframes leg{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.seg{animation:seg .3s ease-in-out infinite alternate}
.seg:nth-child(2n){animation-direction:alternate-reverse}
@keyframes seg{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.crumb,.spark{position:fixed;pointer-events:none;z-index:51}
.flyer{position:fixed;z-index:53;pointer-events:none;font-family:var(--emoji);line-height:1;transform:translate(-50%,-50%)}
.crumb{width:12px;height:12px;border-radius:4px;border:2px solid var(--ink)}
.spark{font-size:34px;color:#ffe14d;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;margin:-20px 0 0 -12px}
.chompTxt{position:fixed;z-index:52;pointer-events:none;font-weight:800;font-size:28px;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill}

/* ---------- celebration ---------- */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#celebrate{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:rgba(43,33,64,.35);padding:16px}
#celebrate.on{display:flex}
.card{background:#fff;border:6px solid var(--ink);border-radius:40px;padding:22px 26px 28px;box-shadow:0 10px 0 var(--ink);text-align:center;
  max-width:640px;width:100%;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
#badge{width:clamp(110px,22vh,180px);height:clamp(110px,22vh,180px);background:none;border:0;padding:0;animation:spin 3s ease-in-out infinite}
@keyframes spin{50%{transform:rotate(10deg) scale(1.06)}}
.card h1{margin:6px 0 18px;font-size:clamp(30px,5.4vw,52px);line-height:1.15}
.btns{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.big{min-height:96px;min-width:200px;border-radius:30px;border:5px solid var(--ink);box-shadow:0 8px 0 var(--ink);font-size:clamp(24px,3.6vw,34px);font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 22px}
.big .ic{font-family:var(--emoji);font-size:1.4em}
#again{background:#5ad17a}#change{background:#4aa3ff}
</style>
</head>
<body>

<div id="start" class="screen on">
  <button id="title" aria-label="Word Train"><span>W</span><span>o</span><span>r</span><span>d</span> Train</button>
  <canvas id="startScene"></canvas>
  <div id="levels">
    <button class="lvl easy" data-level="easy"><span class="stars">★</span>Easy</button>
    <button class="lvl medium" data-level="medium"><span class="stars">★★</span>Medium</button>
    <button class="lvl hard" data-level="hard"><span class="stars">★★★</span>Hard</button>
  </div>
</div>

<div id="game" class="screen">
  <div id="sceneWrap">
    <canvas id="scene"></canvas>
    <button id="home" aria-label="Back to levels">🏠</button>
  </div>
  <div id="qarea" class="off">
    <button id="pic" aria-label="Hear the question again"></button>
    <div id="words"></div>
  </div>
  <div id="foot">
    <button id="whistle" aria-label="Train whistle">
      <svg viewBox="0 0 100 100" stroke="#2b2140" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M30 22c-9-7 3-12-4-20M50 18c-9-7 3-12-4-20M70 22c-9-7 3-12-4-20" fill="none" stroke="#fff" stroke-width="6"/>
        <rect x="31" y="27" width="38" height="11" rx="5" fill="#ffb627"/>
        <rect x="37" y="36" width="26" height="36" rx="6" fill="#ffd23f"/>
        <rect x="41" y="50" width="18" height="7" rx="2" fill="#2b2140"/>
        <rect x="44" y="72" width="12" height="11" fill="#d89a2a"/>
        <rect x="28" y="82" width="44" height="11" rx="5" fill="#8a5a3c"/>
      </svg>
    </button>
    <div id="map">
      <div class="mtrack"></div><div class="mfill" id="mfill"></div>
      <div id="mtrain">
        <svg viewBox="0 0 46 30" stroke="#2b2140" stroke-width="2.5" stroke-linejoin="round">
          <rect x="3" y="4" width="13" height="18" rx="2" fill="#e9483f"/>
          <rect x="14" y="10" width="24" height="12" rx="4" fill="#3a7bd5"/>
          <rect x="30" y="2" width="6" height="9" fill="#2b2140"/>
          <path d="M38 22l6 6H34z" fill="#e9483f"/>
          <circle cx="10" cy="24" r="5" fill="#ffd23f"/><circle cx="25" cy="25" r="4" fill="#ffd23f"/>
        </svg>
      </div>
    </div>
  </div>
</div>

<div id="bugs"></div>

<div id="celebrate">
  <div class="card">
    <button id="badge" aria-label="Hear it again">
      <svg viewBox="-60 -60 120 120" stroke="#2b2140" stroke-width="5" stroke-linejoin="round">
        <path d="M0-54 15-19 53-17 23 7 33 44 0 23-33 44-23 7-53-17-15-19Z" fill="#ffe14d"/>
        <circle cx="-11" cy="-4" r="5" fill="#2b2140" stroke="none"/><circle cx="11" cy="-4" r="5" fill="#2b2140" stroke="none"/>
        <path d="M-12 8q12 12 24 0" fill="none" stroke-linecap="round"/>
        <circle cx="-20" cy="7" r="5" fill="#ff9ab3" stroke="none"/><circle cx="20" cy="7" r="5" fill="#ff9ab3" stroke="none"/>
      </svg>
    </button>
    <h1>You did it, Conductor!</h1>
    <div class="btns">
      <button class="big" id="again"><span class="ic">🔁</span>Play Again</button>
      <button class="big" id="change"><span class="ic">⭐</span>Change Level</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
"use strict";
// ======================= words =======================
const LEVELS = {
  easy: [["cat","🐱"],["dog","🐶"],["pig","🐷"],["cow","🐮"],["bee","🐝"],["ant","🐜"],["fox","🦊"],["bat","🦇"],
         ["sun","☀️"],["bus","🚌"],["car","🚗"],["egg","🥚"],["hat","🎩"],["bed","🛏️"],["cup","☕"],["pie","🥧"]],
  medium: [["frog","🐸"],["fish","🐟"],["duck","🦆"],["bear","🐻"],["lion","🦁"],["star","⭐"],["moon","🌙"],["tree","🌳"],
           ["ball","⚽"],["cake","🍰"],["apple","🍎"],["pizza","🍕"],["horse","🐴"],["mouse","🐭"],["snake","🐍"],["bread","🍞"]],
  hard: [["banana","🍌"],["rabbit","🐰"],["turtle","🐢"],["monkey","🐵"],["rocket","🚀"],["carrot","🥕"],["cookie","🍪"],["flower","🌸"],
         ["penguin","🐧"],["giraffe","🦒"],["octopus","🐙"],["elephant","🐘"],["dinosaur","🦕"],["strawberry","🍓"],["butterfly","🦋"],["pineapple","🍍"]],
};
const PROMPTS = ["Which word matches the picture?", "Find the word for this picture!", "Which word is it?"];
const PRAISE = ["Great reading!", "Toot toot! You got it!", "Yes! Full steam ahead!", "Super reading!", "Faster and faster!"];

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ======================= audio =======================
let ac = null, master = null, noiseBuf = null;
function audio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 6; comp.ratio.value = 12; comp.attack.value = 0.003; comp.release.value = 0.2;
    master = ac.createGain(); master.gain.value = 0.85;   // overall cap, keeps the loudest whistle comfortable
    master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function noise() { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s; }
function env(t, peak, attack, hold, release) {
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.setValueAtTime(peak, t + attack + hold); g.gain.linearRampToValueAtTime(0, t + attack + hold + release);
  return g;
}

// Whistle volume steps: index = correct answers so far this round.
const WHISTLE_VOL = [0.22, 0.29, 0.36, 0.43, 0.5, 0.57], FINAL_VOL = 0.66;
function whistle(vol, dur = 1.0) {
  if (!ac) return;
  const t = ac.currentTime + 0.02;
  const out = env(t, vol, 0.09, dur - 0.34, 0.25); out.connect(master);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3400; lp.connect(out);
  const lfo = ac.createOscillator(); lfo.frequency.value = 5.5;
  const lfoG = ac.createGain(); lfoG.gain.value = 4; lfo.connect(lfoG);
  for (const f of [440, 523.25, 659.25]) {
    for (const [type, lvl] of [["triangle", 0.24], ["sawtooth", 0.045]]) {
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f * 0.92, t);
      o.frequency.exponentialRampToValueAtTime(f, t + 0.15);
      o.frequency.setValueAtTime(f, t + dur - 0.22);
      o.frequency.exponentialRampToValueAtTime(f * 0.95, t + dur);
      lfoG.connect(o.frequency);
      const g = ac.createGain(); g.gain.value = lvl; o.connect(g); g.connect(lp);
      o.start(t); o.stop(t + dur + 0.05);
    }
  }
  const n = noise(), bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1900; bp.Q.value = 1.3;
  const ng = ac.createGain(); ng.gain.value = 0.1; n.connect(bp); bp.connect(ng); ng.connect(out);
  n.start(t); n.stop(t + dur + 0.05); lfo.start(t); lfo.stop(t + dur + 0.05);
}
function moo() {
  if (!ac) return;
  const t = ac.currentTime + 0.02, d = 1.25;
  const g = env(t, 0.55, 0.15, d - 0.55, 0.4); g.connect(master);
  const f = ac.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 7;
  f.frequency.setValueAtTime(320, t); f.frequency.linearRampToValueAtTime(950, t + 0.35); f.frequency.linearRampToValueAtTime(380, t + d);
  f.connect(g);
  for (const det of [0, 3.5]) {
    const o = ac.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(122 + det, t); o.frequency.linearRampToValueAtTime(138 + det, t + 0.3); o.frequency.linearRampToValueAtTime(96 + det, t + d);
    o.connect(f); o.start(t); o.stop(t + d + 0.05);
  }
}
function chomp() {
  if (!ac) return;
  for (const off of [0, 0.12]) {
    const t = ac.currentTime + 0.01 + off;
    const n = noise(), lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1500;
    const g = env(t, 0.45, 0.005, 0.02, 0.07); n.connect(lp); lp.connect(g); g.connect(master); n.start(t); n.stop(t + 0.12);
    const o = ac.createOscillator(); o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.09);
    const og = env(t, 0.4, 0.005, 0.02, 0.07); o.connect(og); og.connect(master); o.start(t); o.stop(t + 0.12);
  }
}
function chuff(strength) {
  if (!ac) return;
  const t = ac.currentTime + 0.005;
  const n = noise(), bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 650; bp.Q.value = 0.9;
  const g = env(t, 0.05 + 0.07 * strength, 0.01, 0.02, 0.1); n.connect(bp); bp.connect(g); g.connect(master); n.start(t); n.stop(t + 0.15);
}
function clop(i) {
  if (!ac) return;
  const t = ac.currentTime + 0.005;
  const o = ac.createOscillator(); o.frequency.value = i % 2 ? 640 : 860;
  const g = env(t, 0.22, 0.003, 0.01, 0.05); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.08);
}
function ding() {
  if (!ac) return;
  [1046.5, 1318.5, 1568].forEach((f, i) => {
    const t = ac.currentTime + 0.01 + i * 0.07;
    const o = ac.createOscillator(); o.frequency.value = f;
    const g = env(t, 0.13, 0.005, 0.03, 0.35); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.42);
  });
}
function pop() {
  if (!ac) return;
  const t = ac.currentTime + 0.01, o = ac.createOscillator();
  o.frequency.setValueAtTime(500, t); o.frequency.exponentialRampToValueAtTime(950, t + 0.1);
  const g = env(t, 0.14, 0.005, 0.03, 0.08); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.15);
}

// ======================= speech (prompts only, never the answer word) =======================
let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  for (const p of [/samantha/i, /natural/i, /enhanced|premium/i, /google us english/i, /aria|jenny|zira/i]) {
    const v = vs.find(v => p.test(v.name)); if (v) return v;
  }
  return vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null;
}

let voiceBuf = null, voiceSrc = null;
// Decoded at page load (an OfflineAudioContext needs no tap), so the very first line already has clips.
(function loadVoice() {
  if (!VOICE || !window.OfflineAudioContext) return;
  const bin = atob(VOICE.mp3), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  new OfflineAudioContext(1, 1, 24000).decodeAudioData(bytes.buffer, b => { voiceBuf = b; }, () => {});
})();
function stopTalking() {
  if (voiceSrc) { try { voiceSrc.stop(); } catch (e) {} voiceSrc = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function say(text) {
  stopTalking();
  const clip = VOICE && VOICE.clips[text];
  if (clip && voiceBuf && ac) {
    const src = ac.createBufferSource(), g = ac.createGain();
    g.gain.value = 0.9; src.buffer = voiceBuf; src.connect(g); g.connect(master);
    src.start(ac.currentTime + 0.02, Math.max(0, clip[0] - 0.04), clip[1] + 0.1);
    voiceSrc = src;
    return;
  }
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  voice = voice || pickVoice(); if (voice) u.voice = voice;
  u.rate = 0.92; u.pitch = 1.1;
  speechSynthesis.speak(u);
}

// ======================= scene drawing =======================
const INK = "#2b2140", D = 1500;   // D = track distance between stations
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function shape(c, fill, lw = 4) { c.fillStyle = fill; c.fill(); c.lineWidth = lw; c.strokeStyle = INK; c.stroke(); }
function circle(c, x, y, r, fill, lw = 4) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); shape(c, fill, lw); }

function wheel(c, x, y, r, ang, col) {
  circle(c, x, y, r, col);
  c.save(); c.translate(x, y); c.rotate(ang); c.strokeStyle = INK; c.lineWidth = 2.5;
  for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(-r * 0.72, 0); c.lineTo(r * 0.72, 0); c.stroke(); c.rotate(Math.PI / 3); }
  c.restore();
  circle(c, x, y, r * 0.28, "#ffd23f", 2.5);
}

// x = engine front, y = rail top
function drawTrain(c, x, y, pos, cargo, bob) {
  const carCols = ["#ffcf3f", "#5ad17a"];
  for (let k = 0; k < 2; k++) {
    const cx = x - 130 - k * 104, cy = y - bob * (k % 2 ? 1 : 0.6);
    c.fillStyle = INK; c.fillRect(cx - 4, y - 32, 16, 6);
    c.font = `32px ${EMOJI_FONT}`; c.textAlign = "center"; c.textBaseline = "middle";
    cargo.slice(k * 3, k * 3 + 3).forEach((e, j) => c.fillText(e, cx - 72 + j * 25, cy - 84));
    rr(c, cx - 94, cy - 74, 94, 46, 9); shape(c, carCols[k]);
    c.fillStyle = "rgba(255,255,255,.35)"; rr(c, cx - 86, cy - 66, 78, 8, 4); c.fill();
    wheel(c, cx - 72, y - 13, 13, pos / 13, "#3d3556");
    wheel(c, cx - 22, y - 13, 13, pos / 13, "#3d3556");
  }
  c.save(); c.translate(0, -bob);
  rr(c, x - 126, y - 38, 118, 12, 4); shape(c, "#3d3556");
  rr(c, x - 126, y - 114, 52, 80, 6); shape(c, "#e9483f");
  rr(c, x - 134, y - 124, 68, 14, 6); shape(c, "#3d3556");
  rr(c, x - 116, y - 102, 32, 26, 5); shape(c, "#bfe9ff", 3);
  rr(c, x - 82, y - 82, 72, 48, 14); shape(c, "#3a7bd5");
  c.strokeStyle = INK; c.lineWidth = 3;
  for (const bx of [x - 62, x - 40]) { c.beginPath(); c.moveTo(bx, y - 82); c.lineTo(bx, y - 34); c.stroke(); }
  c.beginPath(); c.moveTo(x - 36, y - 80); c.lineTo(x - 38, y - 104); c.lineTo(x - 45, y - 114);
  c.lineTo(x - 13, y - 114); c.lineTo(x - 20, y - 104); c.lineTo(x - 22, y - 80); c.closePath(); shape(c, "#3d3556");
  c.beginPath(); c.arc(x - 62, y - 81, 10, Math.PI, 0); c.closePath(); shape(c, "#ffd23f");
  // friendly face on the front
  circle(c, x - 8, y - 58, 23, "#e3dff0");
  circle(c, x - 15, y - 64, 5.5, "#fff", 2.5); circle(c, x - 1, y - 64, 5.5, "#fff", 2.5);
  c.fillStyle = INK; c.beginPath(); c.arc(x - 13.5, y - 64, 2.6, 0, 7); c.arc(x + 0.5, y - 64, 2.6, 0, 7); c.fill();
  c.beginPath(); c.arc(x - 8, y - 55, 8, 0.15 * Math.PI, 0.85 * Math.PI); c.lineWidth = 3; c.stroke();
  c.fillStyle = "#ff9ab3"; c.beginPath(); c.arc(x - 21, y - 54, 3.5, 0, 7); c.arc(x + 5, y - 54, 3.5, 0, 7); c.fill();
  c.beginPath(); c.moveTo(x - 22, y - 38); c.lineTo(x - 2, y - 38); c.lineTo(x + 16, y - 3); c.lineTo(x - 22, y - 3); c.closePath(); shape(c, "#e9483f");
  c.restore();
  const a = pos / 19;
  wheel(c, x - 104, y - 19, 19, a, "#e9483f");
  wheel(c, x - 62, y - 19, 19, a, "#e9483f");
  const ox = Math.cos(a) * 9, oy = Math.sin(a) * 9;
  c.strokeStyle = "#8b84a3"; c.lineWidth = 6; c.lineCap = "round";
  c.beginPath(); c.moveTo(x - 104 + ox, y - 19 + oy); c.lineTo(x - 62 + ox, y - 19 + oy); c.stroke();
  c.strokeStyle = INK; c.lineWidth = 2; c.stroke(); c.lineCap = "butt";
}

function drawStation(c, sx, gy, k, emoji) {

}

}

    if (S.travel) {
      const tr = S.travel, p = Math.min(1, (now - tr.t0) / tr.dur);
      S.pos = tr.from + (tr.to - tr.from) * profile(p);
      if (p >= 1) { S.travel = null; tr.res(); }
    }

    if (S.speed > 20) { S.chuffAcc += S.pos - prev; if (S.chuffAcc > 58) { S.chuffAcc = 0; chuff(Math.min(1, S.speed / 700)); } }
    for (const cw of S.cows) {

      if (cw.state === "enter") { cw.o = Math.max(0, cw.o - dt / 1.1); cw.walk = cw.o > 0; if (!cw.o) cw.state = "on"; }
      if (cw.state === "leave") { cw.o = Math.min(1, cw.o + dt / 1.1); cw.walk = cw.o < 1; if (cw.o === 1) cw.state = "off"; }
      cw.bubble -= dt;

    emitPuffs(S, dt);

    updateMap();

    demo.time += dt; demo.pos += demo.speed * dt;
    emitPuffs(demo, dt);

  }

}

function crawl(el, x0, y0, x1, y1, ms) {

    const a = (i / 9) * Math.PI * 2, d = rnd(90, 150);
    s.animate([{ transform: "translate(0,0) scale(.3)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(1.2) rotate(90deg)`, opacity: 0 }],
              { duration: 800, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => s.remove();
  }
}

// The answered picture hops out of its card and lands in the next free cargo slot on the train.
function flyCargo(id, emoji) {
  return new Promise(res => {
    const v = S.view, k = S.cargo.length, pic = $("pic");
    const done = () => { if (id === roundId) S.cargo.push(emoji); res(); };
    if (!v) return done();
    const cr = $("scene").getBoundingClientRect(), pr = pic.getBoundingClientRect();
    const tx = cr.left + (v.trainX - 130 - Math.floor(k / 3) * 104 - 72 + (k % 3) * 25) * v.s, ty = cr.top + (v.gy - 84) * v.s;
    const x0 = pr.left + pr.width / 2, y0 = pr.top + pr.height / 2, dx = tx - x0, dy = ty - y0;
    const fs = parseFloat(getComputedStyle(pic).fontSize), end = 32 * v.s / fs;
    const el = document.createElement("div"); el.className = "flyer"; el.textContent = emoji; el.style.fontSize = fs + "px";
    el.style.left = x0 + "px"; el.style.top = y0 + "px"; document.body.appendChild(el);
    pic.style.visibility = "hidden";
    el.animate([
      { transform: "translate(-50%,-50%) scale(1)" },
      { transform: `translate(calc(-50% + ${dx * 0.45}px),calc(-50% + ${dy * 0.5 - 110}px)) scale(${(1 + end) / 1.7}) rotate(-25deg)`, offset: 0.5 },
      { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${end}) rotate(0deg)` },
    ], { duration: 950, easing: "ease-in-out" }).onfinish = () => {
      el.remove(); pop(); if (id === roundId) sparkleAt(tx, ty); done();
    };
  });
}

// ======================= lookalike distractors =======================
// Per-level skill for this session: 0 = very different distractors, 1 = lookalikes (cat / car / hat).
const skill = { easy: 0, medium: 0, hard: 0 };
function likeness(a, b) {
  let s = (a[0] === b[0] ? 3 : 0) + (a.at(-1) === b.at(-1) ? 1 : 0) + (a.length === b.length ? 1 : 0);
  for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] === b[i]) s++;
  const A = new Set(a), B = new Set(b);
  return s + 2 * [...A].filter(x => B.has(x)).length / new Set([...A, ...B]).size;
}
function pickDistractors(pool, word, level) {
  const others = shuffle(pool.filter(w => w !== word)).sort((x, y) => likeness(word[0], x[0]) - likeness(word[0], y[0]));
  const n = others.length, lo = clamp(Math.round(skill[level] * (n - 1)) - 2, 0, n - 4);
  return shuffle(others.slice(lo, lo + 4)).slice(0, 2);
}

// ======================= missed words come back =======================
// Words the bugs had to rescue return one or two rounds later (this session only).
const missed = { easy: [], medium: [], hard: [] };   // [{word, due: round number}]
const roundsPlayed = { easy: 0, medium: 0, hard: 0 };
function pickWords(level) {
  const pool = LEVELS[level], r = ++roundsPlayed[level];
  const due = missed[level].filter(m => m.due <= r).slice(0, 2).map(m => m.word);
  const rest = shuffle(pool.filter(w => !due.includes(w))).slice(0, 5 - due.length);
  return { round: r, words: shuffle([...due, ...rest]) };
}
function noteAnswer(level, round, word, firstTry) {
  missed[level] = missed[level].filter(m => m.word !== word);
  if (!firstTry) missed[level].push({ word, due: round + 1 + (Math.random() < 0.5 ? 1 : 0) });
}

// ======================= game flow =======================
let roundId = 0, promptText = PROMPTS[0];
class Aborted extends Error {}
async function guard(id, p) { const r = await p; if (id !== roundId) throw new Aborted(); return r; }

function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }

function showQuestion(word, choices, onPick) {
  $("pic").textContent = word[1];
  $("pic").classList.remove("pop"); void $("pic").offsetWidth; $("pic").classList.add("pop");
  $("words").innerHTML = "";
  $("qarea").classList.remove("off");
  pop();
  $("pic").style.visibility = "";
  return shuffle(["#e3f4ff", "#ffe8f0", "#fff6d6"]).map((bg, i) => {
    const b = document.createElement("button"); b.className = "word"; b.textContent = choices[i][0]; b.style.background = bg;
    $("words").appendChild(b); return b;
  });
}

// resolves true when the right word was tapped first time, false after the bugs helped
function ask(id, word, choices) {
  return new Promise(resolve => {
    const btns = showQuestion(word, choices);
    let wrong = false, locked = false;
    btns.forEach((b, i) => b.addEventListener("click", async () => {
      if (locked || id !== roundId) return;
      locked = true;
      if (choices[i] === word) {
        b.classList.remove("pickme"); b.classList.add("yay"); ding(); sparkle(b); resolve(!wrong);
      } else {
        wrong = true;
        await bugsEat(btns.filter((_, j) => choices[j] !== word));
        if (id !== roundId) return;
        btns[choices.indexOf(word)].classList.add("pickme");
        say("Now tap this word!");
        locked = false;
      }
    }));
  });
}

async function trip(id, i) {
  const from = i * D, to = (i + 1) * D, T = 4.6 / (1 + 0.32 * S.spd);
  if (Math.random() < 1 / 3) {
    const cx = from + D * 0.62, n = Math.random() < 0.35 ? 2 : 1;
    for (let k = 0; k < n; k++) S.cows.push({ x: cx + k * 95, state: "wait", o: 1, walk: false, bubble: 0 });
    const stopAt = cx - 118;
    await guard(id, travelTo(stopAt, T * (stopAt - from) / D + 0.5));
    $("whistle").classList.add("hint");
    say(n > 1 ? "Moo! Cows on the track! Blow the whistle!" : "Moo! A cow is on the track! Blow the whistle!");
    const nag = setInterval(() => say("Toot the whistle!"), 9000);
    try { await guard(id, new Promise(r => { S.waitWhistle = r; })); }
    finally { clearInterval(nag); S.waitWhistle = null; $("whistle").classList.remove("hint"); }
    await guard(id, sleep(550));
    moo();
    for (const cw of S.cows) if (cw.state === "on") { cw.state = "leave"; cw.bubble = 1.4; }
    for (let k = 0; k < 8; k++) setTimeout(() => clop(k), 150 + k * 140);
    await guard(id, sleep(1500));
    await guard(id, travelTo(to, T * (to - stopAt) / D + 0.4));
  } else {
    await guard(id, travelTo(to, T));
  }
}

async function playRound(level) {
  const id = ++roundId;
  Object.assign(S, { level, pos: 0, travel: null, cows: [], cargo: [], puffs: [], vol: 0, spd: 0, reached: 0, waitWhistle: null });
  const pool = LEVELS[level];
  const { round, words } = pickWords(level);
  S.words = words;
  $("celebrate").classList.remove("on"); $("whistle").classList.remove("hint"); $("bugs").innerHTML = "";
  show("game");
  try {
    for (let i = 0; i < 5; i++) {
      const word = S.words[i];
      const choices = shuffle([word, ...pickDistractors(pool, word, level)]);
      promptText = i === 0 ? PROMPTS[0] : PROMPTS[(Math.random() * PROMPTS.length) | 0];
      say(i === 0 ? "All aboard! " + promptText : promptText);
      const firstTry = await guard(id, ask(id, word, choices));
      skill[level] = clamp(skill[level] + (firstTry ? 0.15 : -0.25), 0, 1);
      noteAnswer(level, round, word, firstTry);
      if (firstTry) {
        S.vol++; S.spd++;
        const b = document.querySelector(".word.yay").getBoundingClientRect();
        confetti(b.left + b.width / 2, b.top + b.height / 2);
      }
      say(word[0][0].toUpperCase() + word[0].slice(1) + "!");   // read the word back now that it's answered
      const landed = flyCargo(id, word[1]);
      await guard(id, sleep(750));
      whistle(WHISTLE_VOL[S.vol]); steamBurst();
      await guard(id, sleep(750));
      say(firstTry ? PRAISE[i] : "Choo choo! Off we go!");
      await guard(id, Promise.all([landed, sleep(250)]));
      $("qarea").classList.add("off");
      await guard(id, trip(id, i));
      S.reached = i + 1;
    }
    celebrate(id);
  } catch (e) { if (!(e instanceof Aborted)) throw e; }
}

function celebrate(id) {
  whistle(FINAL_VOL, 2.4); steamBurst();
  confetti();
  setTimeout(() => { if (id !== roundId) return; $("celebrate").classList.add("on"); say("You did it, Conductor! Hooray!"); }, 900);
}

function goHome() {
  roundId++; S.travel = null;
  stopTalking();
  $("celebrate").classList.remove("on"); $("qarea").classList.add("off");
  show("start");
}

// ======================= confetti =======================
let confettiPs = [], confettiOn = false;
function confetti(bx, by) {
  const cv = $("confetti"), { W, H } = fit(cv), small = bx !== undefined;
  const cols = ["#ff6b5b", "#ffd23f", "#5ad17a", "#4aa3ff", "#9b6be0", "#ff9ab3"];
  for (let i = 0; i < (small ? 50 : 220); i++) {
    const burst = small || i < 90;
    confettiPs.push({ x: burst ? (small ? bx : W / 2) : rnd(0, W), y: burst ? (small ? by : H * 0.45) : rnd(-H * 0.6, -10),
      vx: burst ? rnd(-1, 1) * (small ? 320 : 520) : rnd(-40, 40), vy: burst ? rnd(-700, -150) * (small ? 0.75 : 1) : rnd(60, 160),
      w: rnd(8, 15), h: rnd(5, 9), a: rnd(0, 6), va: rnd(-8, 8), col: cols[i % cols.length] });
  }
  if (confettiOn) return;
  confettiOn = true;
  let lastT = performance.now();
  (function step(now) {
    const c = cv.getContext("2d"), { dpr, W, H } = fit(cv), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
    for (const p of confettiPs) {
      p.vy += 520 * dt; p.vx *= 0.99; p.vy = Math.min(p.vy, 260);
      p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt;
      c.save(); c.translate(p.x, p.y); c.rotate(p.a); c.fillStyle = p.col; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.a * 1.3))); c.restore();
    }
    confettiPs = confettiPs.filter(p => p.y < H + 30);
    if (confettiPs.length) requestAnimationFrame(step); else { c.clearRect(0, 0, W, H); confettiOn = false; }
  })(lastT);
}

// ======================= wiring =======================
document.querySelectorAll(".lvl").forEach(b => b.addEventListener("click", () => { audio(); playRound(b.dataset.level); }));
$("title").addEventListener("click", () => { audio(); say("Word Train! Pick a level. Green is easy. Yellow is medium. Red is hard."); });
$("pic").addEventListener("click", () => {
  say(promptText);
  $("pic").classList.remove("wiggle", "pop"); void $("pic").offsetWidth; $("pic").classList.add("wiggle");
});
let lastToot = 0;
$("whistle").addEventListener("click", () => {
  audio();
  const now = performance.now(); if (now - lastToot < 350) return; lastToot = now;
  whistle(WHISTLE_VOL[S.vol]); steamBurst();
  const w = $("whistle"); w.classList.remove("toot"); void w.offsetWidth; w.classList.add("toot");
  if (S.waitWhistle) S.waitWhistle();
});
$("home").addEventListener("click", goHome);
$("again").addEventListener("click", () => playRound(S.level));
$("change").addEventListener("click", goHome);
$("badge").addEventListener("click", () => say("You did it, Conductor! Hooray!"));
requestAnimationFrame(frame);
</script>
